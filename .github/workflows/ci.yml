name: CI

on:
  push:
    branches: ['**'] # every branch; tag pushes don't trigger (so the tags this
    # workflow creates don't re-run CI)

permissions:
  contents: read

jobs:
  # Run lint + tests on both architectures. The SIMD scanners have per-arch
  # implementations (amd64 SSE2/AVX2, arm64 NEON), so both must pass before the tag
  # job below publishes a release tag.
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Key the module cache on both modules' lockfiles: bench/ is a separate
          # module and the "Bench module tests" step below compiles it.
          cache-dependency-path: |
            go.sum
            bench/go.sum
      # The generated decoders are gitignored, so a fresh checkout has none and the
      # conformance package (and its test) would not compile. Generate them on both
      # arches — `go vet ./...` type-checks the whole module, so the Vet step needs
      # them too; `make test` regenerates as needed via the same Makefile rule.
      - name: Generate
        run: make generate
      # Nothing else in CI checks formatting, and `make fix` (the fixer) only ever
      # runs by hand. gofmt output is architecture-independent, so once is enough.
      - name: Format
        if: matrix.arch == 'amd64'
        run: make fmt-check
      # Vet runs on BOTH arches on purpose. Most analyzers only read source, but
      # asmdecl is inherently per-GOARCH: on an amd64 runner it validates
      # simd_amd64.s and skipfast_amd64.s against their Go declarations and never
      # looks at the arm64 pair. `go test`'s built-in vet subset does not include
      # asmdecl, so `make test` on the arm64 runner is not a substitute — without
      # this step the NEON assembly is checked by nothing. (Verified by experiment:
      # an off-by-4 result offset in skipfast_arm64.s fails `GOARCH=arm64 go vet`
      # and is invisible to `GOARCH=amd64 go vet`.)
      - name: Vet
        run: make vet
      # pkg/unstable's arm64 SVE2 scanners spell their instructions as WORD
      # constants, because the Go assembler has no SVE mnemonics — so nothing in
      # the Go toolchain can tell whether a constant is the instruction its
      # comment claims, and one wrong nibble assembles, links and runs as a
      # different instruction. internal/sveasm re-derives every constant from the
      # mnemonic beside it with the GNU assembler; this step is the gate that
      # fails if the two ever drift apart. It needs an aarch64 assembler, which is
      # what the install step provides: the cross-assembler on the amd64 runner
      # (sveasm prefers it, so the gate is not arm64-only) and the native binutils
      # on the arm64 one. Runs on both arches because it is cheap and because a
      # contributor may edit the assembly from either.
      - name: Install aarch64 assembler
        run: |
          set -eux
          sudo apt-get update
          if [ "$(uname -m)" = "x86_64" ]; then
            sudo apt-get install -y binutils-aarch64-linux-gnu
          else
            sudo apt-get install -y binutils
          fi
      - name: SVE encodings
        run: make sveasm-check
      # Prebuilt binary (no source compile) + cached binary and lint cache.
      #
      # Runs on BOTH arches, like Vet, and for a closely related reason. This step
      # was amd64-only on the premise that lint is the architecture-independent
      # half of static analysis — which is false for any package with per-arch
      # files, because a linter only sees the files the build tags select. `unused`
      # is the sharp case: pkg/unstable/simd_arm64.go's NEON routines are reached
      # from the SVE2 entry points by an assembly tail branch, so on an arm64 build
      # they read as dead declarations, and on an amd64 build the file is not
      # compiled at all — meaning neither the finding nor its absence was ever
      # established by CI. `make lint` does both arches from one host if you want
      # them locally.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - name: Test
        run: make test
      # bench/ is a separate module, so `make test` (`go test ./...` in the main
      # module) cannot reach it, and both benchmark runners enter it with a -run
      # pattern that matches no test. Its committed parity tests therefore ran
      # nowhere and could rot into a compile failure unnoticed; this compiles and
      # runs the self-contained ones. Only the tests — the benchmarks stay out of
      # CI (they download an ~8 MB input and measure for seconds a case).
      - name: Bench module tests
        if: matrix.arch == 'amd64'
        env:
          # bench/go.mod's `go` directive runs ahead of the main module's, and has
          # to: it requires go-json-experiment/json, which declares go 1.26, and
          # MVS floors a module's own directive at the maximum of its dependencies'.
          # The main module deliberately stays at 1.25.0 — that directive is the
          # minimum Go a library consumer must have, so it is not a knob to turn for
          # a benchmark-only module. setup-go installs from the main go.mod and pins
          # GOTOOLCHAIN=local, which turns that gap into a hard error ("go.mod
          # requires go >= 1.26 ... GOTOOLCHAIN=local") instead of the toolchain
          # switch a contributor sees; `auto` restores it, fetching the newer
          # toolchain for this module alone. The download lands in GOMODCACHE, which
          # the setup-go cache above already covers.
          GOTOOLCHAIN: auto
        run: make bench-test

  # On a green main build, bump the patch of the latest vX.Y.Z tag (the Go module
  # version convention). Patch only: a major bump would require a /vN module path,
  # and minor releases are deliberate, so make those by pushing the tag by hand.
  tag:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the new tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history and existing tags
      - name: Bump patch version tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --tags --force
          if tag=$(git describe --tags --exact-match 2>/dev/null); then
            echo "HEAD is already tagged ($tag); nothing to do."
            exit 0
          fi
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next='v0.0.1'
          else
            v=${latest#v}
            IFS=. read -r major minor patch <<<"$v"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Tagging $next (previous: ${latest:-none})"
          git tag -a "$next" -m "$next"
          git push origin "$next"
